<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b5d3b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Quran Reader</title>
<style>
@font-face{font-family:"QFont";src:url("KFGQPCNastaleeq-Regular.woff2") format("woff2");font-display:block}
:root{--bg:#ffffff;--fg:#000000;--line:#000000;--bar:#0b5d3b;--barfg:#ffffff;--panel:#ffffff;--soft:#eef3ef;--bold:0.012;--rule:1px;--rh:60px;--pw:600px}
body.night{--bg:#0d0f0e;--fg:#e8e4d8;--line:#8a8a80;--bar:#1b1f1d;--barfg:#e8e4d8;--panel:#1a1d1c;--soft:#252927}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,Arial,sans-serif;overflow:hidden;overscroll-behavior:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
#top{display:flex;align-items:center;justify-content:space-between;height:54px;padding:0 12px;background:var(--bar);color:var(--barfg);flex:none}
#top .c{text-align:center;line-height:1.15;flex:1}
#top .t{font-family:QFont,serif;font-size:21px}
#top .no{font-family:system-ui,Arial,sans-serif;font-size:15px;font-weight:700;margin:0 4px;background:rgba(255,255,255,.18);border-radius:10px;padding:1px 7px}
#top .pr{font-size:13px;opacity:.95;margin-top:2px}
#top .pr b{font-family:QFont,serif;font-weight:400;font-size:15px}
#top button{background:none;border:0;color:var(--barfg);font-size:22px;padding:6px 8px}
#stage{flex:1;min-height:0;padding:6px;position:relative;display:flex;align-items:center;justify-content:center}
#page{height:100%;width:100%;flex:none;border:3px solid var(--line);outline:1px solid var(--line);outline-offset:2px;display:flex;flex-direction:column;justify-content:center;background:var(--bg);touch-action:pan-y;user-select:none;-webkit-user-select:none}
.ln{height:var(--rh);flex:none;display:flex;align-items:center;justify-content:center;border-bottom:var(--rule) solid var(--line);overflow:hidden;padding:0 6px}
.ln:last-child{border-bottom:0}
.ln .t{display:inline-block;white-space:nowrap;direction:rtl;font-family:QFont,serif;-webkit-text-stroke:calc(var(--bold) * 1em) currentColor;line-height:1.5}
.ln.s{padding:2px 4px}
.sbox{width:100%;height:92%;border:2px double var(--line);border-radius:10px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;background:var(--soft);font-family:QFont,serif}
.sbox .n{font-family:system-ui,'Noto Naskh Arabic',Arial,sans-serif;font-size:14px;min-width:70px}.sbox .n:last-child{text-align:right}
.sbox .nm{font-size:22px;white-space:nowrap}
#bar{display:flex;justify-content:space-around;background:var(--bar);flex:none;padding:4px 0 calc(4px + env(safe-area-inset-bottom))}
#bar button{flex:1;background:none;border:0;color:var(--barfg);font-size:22px;padding:6px 2px;line-height:1}
.navb{position:fixed;top:50%;transform:translateY(-50%);width:46px;height:70px;border:0;border-radius:10px;background:rgba(11,93,59,.88);color:#fff;font-size:30px;display:none;z-index:5;cursor:pointer}
.navb:hover{background:#0b5d3b}
#nN{left:max(6px,calc(50% - var(--pw)/2 - 58px))}#nP{right:max(6px,calc(50% - var(--pw)/2 - 58px))}
@media (hover:hover) and (pointer:fine){.navb{display:block}}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg .btn.on{outline:3px solid #d4a017}
#bar small{display:block;font-size:10px;margin-top:2px;opacity:.85}
.hide #top,.hide #bar{display:none}
body.hide .navb{opacity:.5}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:10}
#modal.on{display:flex}
#sheet{background:var(--panel);color:var(--fg);width:100%;max-width:640px;max-height:88%;border-radius:16px 16px 0 0;display:flex;flex-direction:column}
#sheet h2{margin:0;padding:14px 16px;font-size:18px;display:flex;justify-content:space-between;align-items:center}
#sheet h2 button{background:none;border:0;font-size:22px;color:var(--fg)}
#body{overflow:auto;padding:0 16px 20px}
input[type=text],input[type=number]{width:100%;padding:11px;font-size:16px;border:1px solid #888;border-radius:8px;background:var(--bg);color:var(--fg)}
.row{display:flex;gap:8px;margin:8px 0}
.btn{padding:10px 14px;border:0;border-radius:8px;background:var(--bar);color:var(--barfg);font-size:15px}
.item{display:flex;justify-content:space-between;align-items:center;padding:11px 4px;border-bottom:1px solid #8884}
.item .a{font-family:QFont,serif;font-size:20px}
.item .m{font-size:13px;opacity:.8}
.snip{font-family:QFont,serif;font-size:18px;direction:rtl;text-align:right;padding:8px 4px;border-bottom:1px solid #8884}
label{display:block;margin:14px 0 4px;font-weight:600}
.note{font-size:13px;opacity:.75;margin-top:14px}
.w.sel{background:rgba(212,160,23,.40);border-radius:6px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
#modal.ay{background:transparent;pointer-events:none}
#modal.ay #sheet{pointer-events:auto;max-height:88%;height:var(--ah,46vh);box-shadow:0 -4px 18px rgba(0,0,0,.35)}
#body{min-height:0}
#modal.ay #body{display:flex;flex-direction:column;overflow:hidden;padding-bottom:0}
#modal.ay #pc{flex:1;min-height:0;overflow:auto;padding-bottom:20px}
#grip{display:none;width:46px;height:5px;border-radius:3px;background:#888;margin:8px auto 0}
#modal.ay #grip{display:block}
#modal.ay #mh{touch-action:none;cursor:ns-resize;padding-top:6px}
#mSize{display:none}#modal.ay #mSize{display:inline-block}
.ctl{display:flex;gap:6px;margin:0 0 6px;align-items:center}.ctl .btn{padding:9px 14px;font-size:16px}.ctl select{flex:1;min-width:0}
.ayar{font-family:QFont,serif;font-size:26px;line-height:2;direction:rtl;text-align:center;-webkit-text-stroke:calc(var(--bold) * 1em) currentColor;border-bottom:1px solid #8886;padding-bottom:6px;margin-bottom:4px}
#showBars{display:none;position:fixed;top:calc(8px + env(safe-area-inset-top));right:8px;z-index:6;width:40px;height:40px;border:0;border-radius:20px;background:rgba(11,93,59,.85);color:#fff;font-size:20px}
body.hide #showBars{display:block}
select{width:100%;padding:10px;font-size:15px;border-radius:8px;border:1px solid #888;background:var(--bg);color:var(--fg)}
.trt{font-family:'Noto Nastaliq Urdu','Jameel Noori Nastaleeq','Noto Naskh Arabic','Droid Naskh',system-ui,Arial,sans-serif;font-size:26px;line-height:2.1;direction:rtl;text-align:right;margin:12px 0}
.fn{font-family:'Noto Nastaliq Urdu','Jameel Noori Nastaleeq','Noto Naskh Arabic','Droid Naskh',system-ui,Arial,sans-serif;font-size:26px;line-height:2.1;direction:rtl;text-align:right;background:var(--soft);border-radius:8px;padding:8px 10px;margin:8px 0}
.cr{font-size:12px;opacity:.75;margin-top:10px;line-height:1.5}
.navrow{display:flex;gap:8px;margin:2px 0 10px}.navrow .btn{flex:1}
</style>
</head>
<body>
<div id="app">
  <div id="top"><button id="bmBtn" title="Bookmark this page">☆</button><div class="c"><div class="t" id="hSurah"></div><div class="pr" id="hPara"></div></div><span id="hPage" style="font-size:16px;min-width:40px;text-align:right"></span></div>
  <div id="stage"><div id="page"></div></div>
  <div id="bar">
    <button id="bNext">◀<small>Next</small></button>
    <button id="bSet">⚙<small>Settings</small></button>
    <button id="bIdx">☰<small>Index</small></button>
    <button id="bNight">🌙<small>Night</small></button>
    <button id="bBm">🔖<small>Bookmarks</small></button>
    <button id="bPrev">▶<small>Previous</small></button>
  </div>
</div>
<button id="showBars" title="Show bars">☰</button><button class="navb" id="nN" title="Next page (Left arrow)">◀</button><button class="navb" id="nP" title="Previous page (Right arrow)">▶</button>
<div id="modal"><div id="sheet"><div id="grip"></div><h2 id="mh"><span id="mTitle"></span><span><button id="mSize" title="Panel size: small / medium / large">⇕</button><button id="mClose">✕</button></span></h2><div id="body"></div></div></div>
<script src="quran-data.js"></script>
<script>
(function(){
var TOTAL=847, P=Q.pages, cur=1, bms=[], $=function(i){return document.getElementById(i)};
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function ar(n){return String(n).replace(/\d/g,function(d){return '٠١٢٣٤٥٦٧٨٩'[d]})}
try{bms=JSON.parse(ls('q_bm')||'[]')}catch(e){bms=[]}
var bold=parseFloat(ls('q_bold2')); if(isNaN(bold)||bold<0||bold>0.04)bold=0.012;
var rule=ls('q_rule')!=='0';
function applyTheme(){document.body.classList.toggle('night',ls('q_night')==='1');
  document.documentElement.style.setProperty('--bold',bold);
  document.documentElement.style.setProperty('--rule',rule?'1px':'0px');
  document.querySelector('meta[name=theme-color]').content=ls('q_night')==='1'?'#1b1f1d':'#0b5d3b'}
function render(){
  var pg=P[cur-1], h='';
  for(var i=0;i<pg.length;i++){var l=pg[i];
    if(l[0]==='s'){var s=l[2];
      h+='<div class="ln s" data-k="s"><div class="sbox"><span class="n">آيات '+Q.cnt[s-1]+'</span><span class="nm">سُورَةُ '+Q.ar[s-1]+'</span><span class="n">'+s+'</span></div></div>'}
    else if(l[0]==='b')h+='<div class="ln" data-k="b" data-c="1"><span class="t">'+l[2]+'</span></div>';
    else h+='<div class="ln" data-k="a" data-c="'+l[1]+'"><span class="t">'+l[2].map(function(x){return '<span class="w" data-s="'+x[0]+'" data-a="'+x[1]+'">'+x[2]+'</span>'}).join(' ')+'</span></div>'}
  $('page').innerHTML=h;
  var sn=Q.ps[cur-1], jn=Q.pj[cur-1];
  $('hSurah').innerHTML='سورة '+Q.ar[sn-1]+'<span class="no">'+sn+'</span>';
  $('hPara').innerHTML='<span dir="rtl">پارہ '+jn+' · <b>'+Q.jn[jn-1]+'</b></span>';
  $('hPage').textContent=cur;
  $('bmBtn').textContent=bms.indexOf(cur)>-1?'★':'☆';
  ls('q_page',cur);
  fit();
  if(sel)mark();
}
function fit(){
  var pgEl=$('page'), st=$('stage'); if(!pgEl.firstChild)return;
  var sw=st.clientWidth-12, sh=st.clientHeight-12;
  var rowH=Math.max(30,Math.floor((sh-6)/13)), H=rowH*13+6;
  var W=Math.min(sw, Math.round(H*0.66), 760);
  pgEl.style.height=H+'px'; pgEl.style.width=W+'px';
  document.documentElement.style.setProperty('--rh',rowH+'px');
  document.documentElement.style.setProperty('--pw',W+'px');
  var avail=W-6-12-20, cap=rowH*0.56, base=40;
  var ts=pgEl.querySelectorAll('.ln:not(.s) .t'), info=[], fits=[];
  for(var i=0;i<ts.length;i++){var t=ts[i];
    t.style.fontSize=base+'px'; t.style.wordSpacing='0px'; t.style.transform='none';
    var w=t.offsetWidth; var fit=w?base*avail/w:cap; info.push([t,w,fit]);
    if(t.parentNode.dataset.c!=='1')fits.push(fit)}
  fits.sort(function(a,b){return a-b});
  var F=Math.min(cap, fits.length?fits[Math.floor(fits.length*0.2)]:cap);
  for(i=0;i<info.length;i++){var t=info[i][0], w=info[i][1], fit=info[i][2], ln=t.parentNode, c=ln.dataset.c==='1', fs=F, sx=1;
    if(fit<F){var r=fit/F; if(r>=0.86){sx=r}else{fs=fit}}
    t.style.fontSize=fs+'px';
    if(sx<1)t.style.transform='scaleX('+sx+')';
    if(!c){var w2=w*fs/base*sx, sp=(t.textContent.match(/ /g)||[]).length;
      if(sp>0&&avail>w2){t.style.wordSpacing=Math.min((avail-w2)/sp/sx, fs*1.5)+'px'}}}
  var nm=pgEl.querySelectorAll('.nm'); for(i=0;i<nm.length;i++)nm[i].style.fontSize=Math.min(26,rowH*0.48)+'px';
}
function go(p){p=Math.max(1,Math.min(TOTAL,parseInt(p)||1));cur=p;render()}
// swipe + tap + keys
var sx=0,sy=0,moved=false;
var pe=$('page');
pe.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
pe.addEventListener('touchend',function(e){var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5){go(dx>0?cur+1:cur-1)}
});
pe.addEventListener('click',function(e){var w=e.target.closest&&e.target.closest('.w');
  if(w){pick(parseInt(w.getAttribute('data-s')),parseInt(w.getAttribute('data-a')))}
  else{toggleBars()}});
$('showBars').onclick=function(){toggleBars()};
function toggleBars(){document.body.classList.toggle('hide');setTimeout(fit,60)}
function modalOpen(){var m=$('modal');return m.classList.contains('on')&&!m.classList.contains('ay')}
document.addEventListener('keydown',function(e){
  if(/INPUT|TEXTAREA/.test((document.activeElement||{}).tagName||''))return;
  var k=e.key;
  if(modalOpen()){if(k==='Escape')close();return}
  if(k==='ArrowLeft'||k==='PageDown'||k===' '||k==='ArrowDown'){e.preventDefault();go(cur+1)}
  else if(k==='ArrowRight'||k==='PageUp'||k==='Backspace'||k==='ArrowUp'){e.preventDefault();go(cur-1)}
  else if(k==='Home')go(1); else if(k==='End')go(TOTAL);
  else if(k==='b'||k==='B')$('bmBtn').click();
  else if(k==='n'||k==='N')$('bNight').click();
  else if(k==='f'||k==='F'){document.body.classList.toggle('hide');setTimeout(fit,50)}});
var lastW=0;pe.addEventListener('wheel',function(e){e.preventDefault();var t=Date.now();if(t-lastW<250)return;lastW=t;go(e.deltaY>0?cur+1:cur-1)},{passive:false});
$('bNext').onclick=$('nN').onclick=function(){go(cur+1)};
$('bPrev').onclick=$('nP').onclick=function(){go(cur-1)};
window.addEventListener('resize',function(){setTimeout(fit,60)});
// modal
function open(title,html){$('modal').classList.remove('ay');$('mTitle').textContent=title;$('body').innerHTML=html;$('modal').classList.add('on')}
function close(){$('modal').classList.remove('on');$('modal').classList.remove('ay');sel=null;mark()}
$('mClose').onclick=close; $('modal').addEventListener('click',function(e){if(e.target.id==='modal')close()});
function surahList(f){var h='';f=(f||'').toLowerCase().trim();
  for(var i=0;i<114;i++){var t=(Q.en[i]+' '+Q.ar[i]+' '+(i+1)).toLowerCase();
    if(f&&t.indexOf(f)<0)continue;
    h+='<div class="item" data-p="'+Q.st[i]+'"><span><b>'+(i+1)+'.</b> '+Q.en[i]+'<div class="m">Page '+Q.st[i]+' · '+Q.cnt[i]+' ayahs</div></span><span class="a">'+Q.ar[i]+'</span></div>'}
  return h||'<p>No surah found.</p>'}
function paraList(){var h='';for(var j=0;j<30;j++)h+='<div class="item" data-p="'+Q.jst[j]+'"><span><b>Para '+(j+1)+'</b><div class="m">Page '+Q.jst[j]+'</div></span><span class="a">'+Q.jn[j]+'</span></div>';return h}
function bindItems(){var it=document.querySelectorAll('#body [data-p]');for(var i=0;i<it.length;i++)it[i].onclick=function(){go(this.getAttribute('data-p'));close()}}
function norm(s){return s.replace(/[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED\u0640\uFB50-\uFDFF\uFE70-\uFEFF\u08D3-\u08FF]/g,'')
  .replace(/[ٱأإآ]/g,'ا').replace(/[یىي]/g,'ي').replace(/[کك]/g,'ك').replace(/[ہھۃة]/g,'ه').replace(/[ؤ]/g,'و').replace(/\s+/g,' ').trim()}
var idx=null;
function buildIdx(){idx=[];for(var p=0;p<P.length;p++)for(var i=0;i<P[p].length;i++){var l=P[p][i];if(l[0]==='a'){var tx=l[2].map(function(x){return x[2]}).join(' ');idx.push([p+1,norm(tx),tx])}}}
function doSearch(q){q=norm(q);if(q.length<2)return '<p>Type at least 2 letters (Arabic).</p>';
  if(!idx)buildIdx();var out='',n=0;
  for(var i=0;i<idx.length&&n<60;i++){if(idx[i][1].indexOf(q)>-1){n++;out+='<div class="snip" data-p="'+idx[i][0]+'">'+idx[i][2]+'<div class="m" style="direction:ltr;text-align:left;font-family:system-ui;font-size:12px">Page '+idx[i][0]+'</div></div>'}}
  return out||'<p>Nothing found. Search can miss words that are split across two lines.</p>'}
$('bIdx').onclick=function(){
  open('Index / Go to page','<div class="row"><input type="number" id="gp" placeholder="Page 1 - '+TOTAL+'" min="1" max="'+TOTAL+'"><button class="btn" id="gb">Go</button></div>'+
   '<input type="text" id="gs" placeholder="Search surah name (English or Arabic)"><div class="row"><input type="text" id="gq" dir="rtl" placeholder="بحث في القرآن (Arabic text search)"><button class="btn" id="gqb">Find</button></div><div class="seg" style="margin:10px 0"><button class="btn on" id="tS">Surahs</button><button class="btn" id="tP">Paras (30)</button></div><div id="gl">'+surahList('')+'</div>');
  bindItems();
  $('gb').onclick=function(){var v=parseInt($('gp').value);if(v>=1&&v<=TOTAL){go(v);close()}};
  $('tS').onclick=function(){$('tS').classList.add('on');$('tP').classList.remove('on');$('gl').innerHTML=surahList($('gs').value);bindItems()};
  $('tP').onclick=function(){$('tP').classList.add('on');$('tS').classList.remove('on');$('gl').innerHTML=paraList();bindItems()};
  $('gs').oninput=function(){$('gl').innerHTML=surahList(this.value);bindItems()};
  $('gqb').onclick=function(){$('gl').innerHTML=doSearch($('gq').value);bindItems()};
};

// ---- ayah tap + translations ----
var sel=null, TR={}, trKey=ls('q_tr')||'mahmud', amap=null;
var TRL=[
 ['mahmud','Urdu - Mahmud ul Hasan (Shaykh al-Hind)','Urdu translation by Mahmud ul Hasan (Shaykh al-Hind), 1909. Public domain. Copy used: fawazahmed0 / dailyayat.com, via the quran-json project. This is the translation only. The Tafseer Usmani notes are not included.'],
 ['junagarhi','Urdu - Muhammad Junagarhi','Urdu Translation - Muhammad Junagarhi, version 1.1.3. Source: QuranEnc.com. Shown without changes.'],
 ['pashto-sarfaraz','Pashto - Maulawi Janbaz Sarfaraz','Pashto Translation - Maulawi Janbaz Sarfaraz, version 1.0.0. Source: QuranEnc.com. Shown without changes.'],
 ['pashto-rwwad','Pashto - Rowwad Translation Center','Pashto Translation - Rowwad Translation Center, version 1.0.1. Source: QuranEnc.com. Shown without changes.'],
 ['pashto-zakaria','Pashto - Abu Zakaria','Pashto Translation - Abu Zakaria, version 1.0.1. Source: QuranEnc.com. Shown without changes.']];
function mark(){var o=document.querySelectorAll('.w.sel');for(var i=0;i<o.length;i++)o[i].classList.remove('sel');
  if(!sel)return;var w=document.querySelectorAll('.w[data-s="'+sel[0]+'"][data-a="'+sel[1]+'"]');for(i=0;i<w.length;i++)w[i].classList.add('sel')}
function buildAmap(){amap={};for(var p=0;p<P.length;p++)for(var i=0;i<P[p].length;i++){var l=P[p][i];if(l[0]==='a')for(var k=0;k<l[2].length;k++){var key=l[2][k][0]*1000+l[2][k][1];if(!(key in amap))amap[key]=p+1}}}
function pick(s,a){sel=[s,a];mark();panel()}
function stepAyah(d){if(!sel)return;var s=sel[0],a=sel[1]+d;
  if(a>Q.cnt[s-1]){s++;a=1}else if(a<1){s--;if(s<1)return;a=Q.cnt[s-1]}
  if(s>114||s<1)return;
  if(!document.querySelector('.w[data-s="'+s+'"][data-a="'+a+'"]')){if(!amap)buildAmap();var p=amap[s*1000+a];if(p){sel=[s,a];go(p);panel();return}}
  sel=[s,a];mark();panel()}
function loadTr(k,cb){if(TR[k])return cb(TR[k]);
  fetch('tr-'+k+'.json').then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){TR[k]=j;cb(j)}).catch(function(){cb(null)})}
function ayahText(s,a){if(!amap)buildAmap();var p=amap[s*1000+a];if(!p)return '';var out=[],q=p-1;
  while(q<P.length){var f=false;for(var i=0;i<P[q].length;i++){var l=P[q][i];if(l[0]==='a')for(var k=0;k<l[2].length;k++){var x=l[2][k];if(x[0]===s&&x[1]===a){out.push(x[2]);f=true}}}
    if(!f)break;q++}
  return out.join(' ')}
var AH=parseFloat(ls('q_ah'));if(!(AH>=0.2&&AH<=0.85))AH=0.46;
function setAH(){$('sheet').style.setProperty('--ah',Math.round(window.innerHeight*AH)+'px')}
(function(){var h=$('mh'),g=$('grip'),sy=0,sh=0,on=false;
  function dn(e){if(!$('modal').classList.contains('ay'))return;if(e.target.closest&&e.target.closest('button'))return;on=true;sy=e.clientY;sh=$('sheet').offsetHeight;try{e.currentTarget.setPointerCapture(e.pointerId)}catch(x){}}
  function mv(e){if(!on)return;var H=Math.max(120,Math.min(window.innerHeight*0.85,sh+(sy-e.clientY)));AH=H/window.innerHeight;setAH()}
  function up(){if(on){on=false;ls('q_ah',AH.toFixed(3))}}
  [h,g].forEach(function(el){el.addEventListener('pointerdown',dn);el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up)});
  $('mSize').onclick=function(){var z=[0.28,0.46,0.75],n=0;for(var i=0;i<z.length;i++)if(Math.abs(z[i]-AH)<0.05)n=(i+1)%z.length;if(AH>0.7)n=0;AH=z[n];ls('q_ah',AH);setAH()};
  window.addEventListener('resize',setAH)})();
function panel(){if(!sel)return;var s=sel[0],a=sel[1],m=$('modal');
  $('mTitle').textContent=Q.en[s-1]+'  '+s+':'+a;
  var opts='';TRL.forEach(function(t){opts+='<option value="'+t[0]+'"'+(t[0]===trKey?' selected':'')+'>'+t[1]+'</option>'});
  var at=ayahText(s,a).replace(/&/g,'&amp;').replace(/</g,'&lt;');
  $('body').innerHTML='<div class="ctl"><button class="btn" id="aP" title="Previous ayah">◀</button><select id="trs">'+opts+'</select><button class="btn" id="aN" title="Next ayah">▶</button></div><div id="pc"><div class="ayar">'+at+'</div><div id="trb"><p>Loading...</p></div></div>';
  setAH();m.classList.add('ay');m.classList.add('on');
  $('aP').onclick=function(){stepAyah(-1)};$('aN').onclick=function(){stepAyah(1)};
  $('trs').onchange=function(){trKey=this.value;ls('q_tr',trKey);panel()};
  var info=TRL.filter(function(t){return t[0]===trKey})[0], key=trKey;
  loadTr(key,function(j){if(key!==trKey||!sel||sel[0]!==s||sel[1]!==a)return;var b=$('trb');if(!b)return;
    if(!j){b.innerHTML='<p>Could not load this translation. Open the app with internet once so it can be saved on the phone.</p>';return}
    var t=j.t[s-1][a-1], f=j.f?j.f[s-1][a-1]:'';
    var esc=function(x){return x.replace(/&/g,'&amp;').replace(/</g,'&lt;')};
    b.innerHTML='<div class="trt">'+esc(t)+'</div>'+(f?'<div class="fn">'+esc(f).replace(/\n/g,'<br>')+'</div>':'')})}
var BOLDS=[['Light',0],['Medium',0.012],['Bold',0.022],['Extra bold',0.032]];
$('bSet').onclick=function(){
  var b='';BOLDS.forEach(function(x,k){b+='<button class="btn'+(Math.abs(bold-x[1])<0.002?' on':'')+'" data-b="'+x[1]+'">'+x[0]+'</button>'});
  open('Settings','<label>Text boldness</label><div class="seg" id="sg">'+b+'</div>'+
   '<label>Reading screen</label><div class="row"><button class="btn" id="hb">Hide top and bottom bars</button></div>'+
   '<label>Ruled lines</label><div class="row"><button class="btn" id="sr">'+(rule?'Turn off':'Turn on')+'</button></div>'+
   '<p class="note"><b>Phone:</b> swipe right = next page, swipe left = previous page. <b>Tap any ayah</b> to open its translation (Urdu or Pashto). Drag the translation panel up or down to change its size, or tap the ⇕ button. Tap the surah box or an empty place to hide or show the bars.<br><b>PC:</b> Left arrow / Page Down / Space / mouse wheel down = next page. Right arrow / Page Up / mouse wheel up = previous page. Home / End = first / last page. B = bookmark, N = night, F = full screen. You can also use the side buttons.</p>'+
   '<p class="note">Last page read is saved automatically.</p><label>Sources and credits</label><div class="cr">'+TRL.map(function(t){return '<b>'+t[1]+'</b><br>'+t[2]}).join('<br><br>')+'</div><p class="note"> Quran text and layout: Quranic Universal Library (QUL), Taj Company 13-line Indo-Pak. Translations: see Sources and credits below. Font: KFGQPC Nastaleeq (King Fahd Complex). The Quran text is shown exactly as supplied and is not edited.</p>');
  var bs=document.querySelectorAll('#sg [data-b]');for(var i=0;i<bs.length;i++)bs[i].onclick=function(){bold=parseFloat(this.getAttribute('data-b'));ls('q_bold2',bold);applyTheme();fit();
    var o=document.querySelectorAll('#sg [data-b]');for(var k=0;k<o.length;k++)o[k].classList.remove('on');this.classList.add('on')};
  $('hb').onclick=function(){close();toggleBars()};
  $('sr').onclick=function(){rule=!rule;ls('q_rule',rule?'1':'0');applyTheme();this.textContent=rule?'Turn off':'Turn on'};
};
$('bNight').onclick=function(){ls('q_night',ls('q_night')==='1'?'0':'1');applyTheme()};
function bmList(){if(!bms.length)return '<p>No bookmarks yet. Tap ☆ at the top left to bookmark a page.</p>';
  var h='';bms.slice().sort(function(a,b){return a-b}).forEach(function(p){var s=Q.ps[p-1]-1;
   h+='<div class="item"><span data-p="'+p+'" style="flex:1"><b>Page '+p+'</b><div class="m">'+Q.en[s]+'</div></span><button class="btn" data-del="'+p+'">Delete</button></div>'});return h}
function bindBm(){bindItems();var d=document.querySelectorAll('[data-del]');for(var i=0;i<d.length;i++)d[i].onclick=function(){var p=parseInt(this.getAttribute('data-del'));
  bms=bms.filter(function(x){return x!==p});ls('q_bm',JSON.stringify(bms));$('body').innerHTML=bmList();bindBm();$('bmBtn').textContent=bms.indexOf(cur)>-1?'★':'☆'}}
$('bBm').onclick=function(){open('Bookmarks',bmList());bindBm()};
$('bmBtn').onclick=function(){var i=bms.indexOf(cur);if(i>-1)bms.splice(i,1);else bms.push(cur);ls('q_bm',JSON.stringify(bms));$('bmBtn').textContent=bms.indexOf(cur)>-1?'★':'☆'};
applyTheme();
var sp=parseInt(ls('q_page'));if(sp>=1&&sp<=TOTAL)cur=sp;
var q=location.hash.match(/p=(\d+)/);if(q)cur=Math.max(1,Math.min(TOTAL,parseInt(q[1])));
var start=function(){render()};
if(document.fonts&&document.fonts.load){document.fonts.load('40px QFont','بسم').then(start,start)}else start();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js');
})();
</script>
</body>
</html>
